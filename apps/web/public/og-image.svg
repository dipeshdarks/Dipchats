<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0F14"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F8CFF"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.3"/>

  <!-- Chat bubble icon -->
  <g transform="translate(520, 140)">
    <path d="M80 15 C120 15 150 40 150 75 C150 110 125 130 80 130 L60 160 L42 130 C15 130 0 110 0 75 C0 40 15 15 42 15 Z" fill="url(#accent)" opacity="0.9"/>
    <circle cx="40" cy="75" r="8" fill="white"/>
    <circle cx="80" cy="75" r="8" fill="white"/>
    <circle cx="120" cy="75" r="8" fill="white"/>
  </g>

  <!-- Title -->
  <text x="600" y="360" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="700" fill="white">
    DipChats
  </text>

  <!-- Subtitle -->
  <text x="600" y="420" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="400" fill="#94A3B8">
    Real-Time Chat for People, Communities &amp; Conversations
  </text>

  <!-- Tagline -->
  <text x="600" y="470" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#64748B">
    Private  ·  Secure  ·  Instantly Connected
  </text>

  <!-- URL -->
  <text x="600" y="570" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#4F8CFF">
    dipchats.vercel.app
  </text>
</svg>
